# e2e for getplumber/plumber#398: a GitHub filter pattern with `+`
# quantifiers, which glob matching would read literally.
name: semver-tags
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
permissions: {}
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - run: echo "release ${GITHUB_REF_NAME}"
